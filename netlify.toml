[build]
  command = "yarn run build"
  functions = "netlify/functions"
  publish = ".next"

[build.environment]
  NEXT_PUBLIC_MAIN_DOMAIN = "lustrous-malasada-aaed22.netlify.app"

# Temporarily disabled redirects for debugging
# [[redirects]]
#   from = "/*"
#   to = "/.netlify/functions/___netlify-handler"
#   status = 200

# Redirect rules for different subdomains
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[build]
  command = "yarn run build"
  functions = "netlify/functions"
  publish = ".next"

[build.environment]
  NEXT_PUBLIC_MAIN_DOMAIN = "theqcare.org"

# Force HTTPS
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Serve all subdomains directly without redirects
[[redirects]]
  from = "https://:subdomain.theqcare.org/*"
  to = "/:splat"
  status = 200
  headers = {X-Subdomain = ":subdomain"}

[[redirects]]
  from = "http://:subdomain.theqcare.org/*"
  to = "https://:subdomain.theqcare.org/:splat"
  status = 301

# Main domain handling
[[redirects]]
  from = "https://theqcare.org/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "http://theqcare.org/*"
  to = "https://theqcare.org/:splat"
  status = 301

# Temporarily disabled redirects for debugging
# [[redirects]]
#   from = "/*"
#   to = "/.netlify/functions/___netlify-handler"
#   status = 200

# Redirect rules for different subdomains
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

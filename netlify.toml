[build]
  command = "npm run build"
  # Don't set publish directory - @netlify/plugin-nextjs handles it automatically

[build.environment]
  NEXT_PUBLIC_MAIN_DOMAIN = "theqcare.org"
  NODE_VERSION = "20"

# Essential Next.js plugin for Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Force HTTPS
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Next.js rewrites are handled automatically by @netlify/plugin-nextjs
# Don't add manual redirects as they can conflict with the plugin

# Redirect rules for different subdomains
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

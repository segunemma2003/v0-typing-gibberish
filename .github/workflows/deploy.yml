name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e  # Exit on any error
            
            cd /var/www/react-app
            
            echo "🛑 Stopping and cleaning up PM2..."
            pm2 delete my-compasse-app 2>/dev/null || true
            pm2 kill 2>/dev/null || true
            pm2 flush 2>/dev/null || true
            pm2 save 2>/dev/null || true
            
            echo "🔍 Killing all processes on ports 3000, 5000, and 9000..."
            for port in 3000 5000 9000; do
              pid=$(lsof -ti:$port 2>/dev/null || true)
              if [ ! -z "$pid" ]; then
                echo "Killing process $pid on port $port"
                kill -9 $pid 2>/dev/null || true
              fi
            done
            sleep 3
            
            echo "📥 Pulling latest changes from git..."
            git fetch origin
            git reset --hard origin/main || git pull origin main || exit 1
            
            echo "📦 Installing dependencies..."
            # Only clean node_modules if npm install fails (will retry)
            npm install --legacy-peer-deps || {
              echo "⚠️ First install attempt failed, cleaning cache and retrying..."
              npm cache clean --force 2>/dev/null || true
              npm install --legacy-peer-deps || exit 1
            }
            
            echo "🗑️ Removing old build artifacts..."
            rm -rf .next out
            
            echo "🔨 Building application..."
            export NODE_ENV=production
            export PORT=3000
            npm run build || exit 1
            
            echo "✅ Verifying build output..."
            if [ ! -d ".next" ]; then
              echo "❌ ERROR: .next directory not found after build"
              exit 1
            fi
            
            if [ ! -f ".next/BUILD_ID" ]; then
              echo "❌ ERROR: BUILD_ID file not found in .next directory"
              exit 1
            fi
            
            echo "✅ Build verified successfully!"
            echo "   Build ID: $(cat .next/BUILD_ID)"
            
            echo "🔄 Starting PM2 application..."
            # Make sure ecosystem.config.js exists
            if [ ! -f "ecosystem.config.js" ]; then
              echo "⚠️ ecosystem.config.js not found, starting with npm"
              pm2 start npm --name "my-compasse-app" -- start || exit 1
            else
              pm2 start ecosystem.config.js || pm2 start npm --name "my-compasse-app" -- start || exit 1
            fi
            
            echo "💾 Saving PM2 configuration..."
            pm2 save || true
            
            echo "⏳ Waiting for application to initialize..."
            sleep 8
            
            echo "📊 PM2 Process Status:"
            pm2 list
            
            echo "📋 Recent PM2 Logs:"
            pm2 logs my-compasse-app --lines 30 --nostream || echo "⚠️ Could not fetch logs"
            
            echo "🔍 Checking port status..."
            if netstat -tlnp 2>/dev/null | grep -q ":3000"; then
              echo "✅ Port 3000 is listening!"
              netstat -tlnp 2>/dev/null | grep ":3000" || true
            elif ss -tlnp 2>/dev/null | grep -q ":3000"; then
              echo "✅ Port 3000 is listening!"
              ss -tlnp 2>/dev/null | grep ":3000" || true
            else
              echo "⚠️ Port 3000 not detected - checking PM2 status..."
              pm2 describe my-compasse-app || echo "⚠️ Could not describe PM2 process"
            fi
            
            echo "🔄 Reloading Nginx..."
            sudo systemctl reload nginx 2>/dev/null || sudo service nginx reload 2>/dev/null || echo "⚠️ Could not reload nginx (may need manual check)"
            
            echo ""
            echo "✅ Deployment completed successfully!"
            echo "📝 Final PM2 Status:"
            pm2 list
            echo ""
            echo "🔗 Your app should be running on port 3000"
            echo "📋 To check logs: pm2 logs my-compasse-app"
            echo "📊 To monitor: pm2 monit"
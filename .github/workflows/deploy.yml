name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e  # Exit on any error
            
            cd /var/www/react-app
            
            echo "🛑 Stopping and cleaning up PM2 (with timeout protection)..."
            
            # Method 1: Try graceful shutdown with timeout
            echo "Step 1: Graceful PM2 shutdown..."
            timeout 5 pm2 delete my-compasse-app 2>/dev/null || true
            timeout 5 pm2 kill 2>/dev/null || true
            timeout 5 pm2 flush 2>/dev/null || true
            sleep 1
            
            # Method 2: Kill PM2 processes more safely (avoid killing SSH session)
            echo "Step 2: Killing PM2 daemon processes (safely)..."
            # Get current process ID to avoid killing ourselves
            CURRENT_PID=$$
            PARENT_PID=$PPID
            
            # Only kill actual PM2 daemon processes, be very specific
            # Look for processes with "pm2" in the command but exclude our session
            pm2_daemon_pids=$(ps aux | grep -E "[p]m2.*daemon|[p]m2.*God" | awk '{print $2}' 2>/dev/null || true)
            if [ ! -z "$pm2_daemon_pids" ]; then
              for pid in $pm2_daemon_pids; do
                # Skip if it's our current process or parent
                if [ "$pid" != "$CURRENT_PID" ] && [ "$pid" != "$PARENT_PID" ] && [ "$pid" != "1" ]; then
                  # Verify it's actually a PM2 process
                  cmd=$(ps -p $pid -o cmd= 2>/dev/null || echo "")
                  if echo "$cmd" | grep -qE "pm2.*(daemon|God)"; then
                    echo "Killing PM2 daemon process $pid"
                    kill -9 $pid 2>/dev/null || true
                  fi
                fi
              done
            fi
            
            # Kill node processes that are PM2 managed apps (very specific)
            node_pm2_pids=$(ps aux | grep -E "[n]ode.*next|[n]ode.*pm2" | grep -v "grep" | awk '{print $2}' 2>/dev/null || true)
            if [ ! -z "$node_pm2_pids" ]; then
              for pid in $node_pm2_pids; do
                # Skip if it's our current process or parent
                if [ "$pid" != "$CURRENT_PID" ] && [ "$pid" != "$PARENT_PID" ] && [ "$pid" != "1" ]; then
                  # Check if it's actually a PM2 managed process
                  cmd=$(ps -p $pid -o cmd= 2>/dev/null || echo "")
                  if echo "$cmd" | grep -qE "(next|pm2)" && ! echo "$cmd" | grep -qE "(ssh|deploy)"; then
                    echo "Killing node PM2 process $pid"
                    kill -9 $pid 2>/dev/null || true
                  fi
                fi
              done
            fi
            sleep 2
            
            # Method 3: Clean PM2 lock files to prevent hanging
            echo "Step 3: Cleaning PM2 lock files..."
            PM2_HOME="${PM2_HOME:-$HOME/.pm2}"
            if [ -d "$PM2_HOME" ]; then
              rm -f "$PM2_HOME/.sock" 2>/dev/null || true
              rm -f "$PM2_HOME/lock" 2>/dev/null || true
              rm -f "$PM2_HOME/reload.lock" 2>/dev/null || true
              rm -f "$PM2_HOME/pids" 2>/dev/null || true
            fi
            
            # Method 4: Kill processes on ports (more specific)
            echo "Step 4: Killing all processes on ports 9000, 3000, and 5000..."
            for port in 9000 3000 5000; do
              pid=$(lsof -ti:$port 2>/dev/null || true)
              if [ ! -z "$pid" ] && [ "$pid" != "$$" ]; then
                echo "Killing process $pid on port $port"
                kill -9 $pid 2>/dev/null || true
              fi
            done
            sleep 2
            
            # Verify PM2 is stopped (but don't kill if it's our session)
            remaining_pm2=$(ps aux | grep -E "[p]m2.*daemon|[p]m2.*God" | grep -v "$$" | grep -v "$PPID" | awk '{print $2}' 2>/dev/null || true)
            if [ ! -z "$remaining_pm2" ]; then
              echo "⚠️ Warning: Some PM2 daemon processes may still be running"
              echo "   (Not killing to avoid affecting SSH session)"
            else
              echo "✅ PM2 daemon stopped"
            fi
            
            echo "📥 Pulling latest changes from git..."
            git fetch origin
            git reset --hard origin/main || git pull origin main || exit 1
            
            echo "📦 Installing dependencies (with native module fix)..."
            # Clean everything to ensure fresh install of native bindings
            rm -rf node_modules package-lock.json
            npm cache clean --force 2>/dev/null || true
            
            # Install dependencies fresh
            npm install --legacy-peer-deps || exit 1
            
            # Verify lightningcss native bindings are installed
            echo "🔍 Verifying lightningcss installation..."
            if [ ! -d "node_modules/lightningcss" ]; then
              echo "❌ ERROR: lightningcss not installed"
              exit 1
            fi
            
            # Check if native bindings exist
            if find node_modules/lightningcss* -name "*.node" 2>/dev/null | grep -q ".node"; then
              echo "✅ Native bindings found"
            else
              echo "⚠️ Native bindings missing, attempting to fix..."
              # Try reinstalling lightningcss specifically
              npm install lightningcss@latest --legacy-peer-deps --save 2>/dev/null || true
              # Also try installing the platform-specific package
              npm install lightningcss-linux-x64-gnu@latest --legacy-peer-deps --save-optional 2>/dev/null || true
            fi
            
            echo "🗑️ Removing old build artifacts..."
            rm -rf .next out
            
            echo "🔨 Building application..."
            export NODE_ENV=production
            export PORT=9000
            export NEXT_PUBLIC_BASE_DOMAIN=${NEXT_PUBLIC_BASE_DOMAIN:-compasse.net}
            export NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-https://api.compasse.net}
            npm run build || exit 1
            
            echo "✅ Verifying build output..."
            if [ ! -d ".next" ]; then
              echo "❌ ERROR: .next directory not found after build"
              exit 1
            fi
            
            if [ ! -f ".next/BUILD_ID" ]; then
              echo "❌ ERROR: BUILD_ID file not found in .next directory"
              exit 1
            fi
            
            echo "✅ Build verified successfully!"
            echo "   Build ID: $(cat .next/BUILD_ID)"
            
            echo "🔄 Starting PM2 application..."
            
            # Set PM2_HOME explicitly to avoid path issues
            export PM2_HOME="$HOME/.pm2"
            export NEXT_PUBLIC_BASE_DOMAIN=${NEXT_PUBLIC_BASE_DOMAIN:-compasse.net}
            export NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-https://api.compasse.net}
            
            # Ensure PM2 daemon is not running before starting (safely)
            CURRENT_PID=$$
            PARENT_PID=$PPID
            pm2_daemon_pids=$(ps aux | grep -E "[p]m2.*daemon|[p]m2.*God" | awk '{print $2}' 2>/dev/null || true)
            if [ ! -z "$pm2_daemon_pids" ]; then
              echo "⚠️ PM2 daemon still running, killing specific processes..."
              for pid in $pm2_daemon_pids; do
                # Skip if it's our current process, parent, or init
                if [ "$pid" != "$CURRENT_PID" ] && [ "$pid" != "$PARENT_PID" ] && [ "$pid" != "1" ]; then
                  cmd=$(ps -p $pid -o cmd= 2>/dev/null || echo "")
                  if echo "$cmd" | grep -qE "pm2.*(daemon|God)"; then
                    echo "Killing PM2 daemon process $pid"
                    kill -9 $pid 2>/dev/null || true
                  fi
                fi
              done
              sleep 2
            fi
            
            # Start PM2 with timeout to prevent hanging
            echo "🚀 Starting PM2 (with 30s timeout)..."
            if [ ! -f "ecosystem.config.js" ]; then
              echo "⚠️ ecosystem.config.js not found, starting with npm"
              if timeout 30 PORT=9000 NEXT_PUBLIC_BASE_DOMAIN=$NEXT_PUBLIC_BASE_DOMAIN NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL pm2 start npm --name "my-compasse-app" -- start; then
                echo "✅ PM2 started successfully with npm"
              else
                echo "❌ PM2 start failed or timed out"
                echo "🔍 Debugging info:"
                echo "PM2_HOME: $PM2_HOME"
                ls -la "$PM2_HOME" 2>/dev/null || echo "PM2_HOME directory not found"
                pm2 list 2>/dev/null || echo "PM2 list command failed"
                ps aux | grep pm2 | head -5 || true
                exit 1
              fi
            else
              if timeout 30 NEXT_PUBLIC_BASE_DOMAIN=$NEXT_PUBLIC_BASE_DOMAIN NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL pm2 start ecosystem.config.js; then
                echo "✅ PM2 started successfully with ecosystem.config.js"
              else
                echo "⚠️ PM2 start with ecosystem.config.js failed, trying with npm..."
                if timeout 30 PORT=9000 NEXT_PUBLIC_BASE_DOMAIN=$NEXT_PUBLIC_BASE_DOMAIN NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL pm2 start npm --name "my-compasse-app" -- start; then
                  echo "✅ PM2 started successfully with npm fallback"
                else
                  echo "❌ PM2 start failed or timed out with both methods"
                  echo "🔍 Debugging info:"
                  echo "PM2_HOME: $PM2_HOME"
                  ls -la "$PM2_HOME" 2>/dev/null || echo "PM2_HOME directory not found"
                  pm2 list 2>/dev/null || echo "PM2 list command failed"
                  ps aux | grep pm2 | head -5 || true
                  exit 1
                fi
              fi
            fi
            
            # Wait a bit and check if it started successfully
            sleep 3
            if ! pm2 list | grep -q "my-compasse-app.*online"; then
              echo "⚠️ PM2 app may not have started correctly, showing full status:"
              pm2 list
              pm2 logs my-compasse-app --lines 20 --nostream
            fi
            
            echo "💾 Saving PM2 configuration..."
            timeout 5 pm2 save || echo "⚠️ PM2 save failed, but continuing..."
            
            echo "⏳ Waiting for application to initialize..."
            sleep 8
            
            echo "📊 PM2 Process Status:"
            pm2 list
            
            echo "📋 Recent PM2 Logs (errors first):"
            pm2 logs my-compasse-app --err --lines 50 --nostream || echo "⚠️ Could not fetch error logs"
            echo ""
            echo "📋 Recent PM2 Logs (all):"
            pm2 logs my-compasse-app --lines 50 --nostream || echo "⚠️ Could not fetch logs"
            
            echo "🔍 Checking PM2 process details:"
            pm2 describe my-compasse-app || echo "⚠️ Could not describe process"
            
            echo "🔍 Checking for runtime errors..."
            # Check if app is actually responding
            curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" http://localhost:9000 || echo "⚠️ App not responding on localhost:9000"
            
            echo "🔍 Checking port status..."
            if netstat -tlnp 2>/dev/null | grep -q ":9000"; then
              echo "✅ Port 9000 is listening!"
              netstat -tlnp 2>/dev/null | grep ":9000" || true
            elif ss -tlnp 2>/dev/null | grep -q ":9000"; then
              echo "✅ Port 9000 is listening!"
              ss -tlnp 2>/dev/null | grep ":9000" || true
            else
              echo "⚠️ Port 9000 not detected - checking PM2 status..."
              pm2 describe my-compasse-app || echo "⚠️ Could not describe PM2 process"
            fi
            
            echo "🔄 Restarting Nginx..."
            # Test nginx configuration first
            sudo nginx -t 2>/dev/null && echo "✅ Nginx configuration is valid" || echo "⚠️ Nginx configuration test failed"
            
            # Restart nginx (more reliable than reload)
            if sudo systemctl restart nginx 2>/dev/null; then
              echo "✅ Nginx restarted successfully via systemctl"
            elif sudo service nginx restart 2>/dev/null; then
              echo "✅ Nginx restarted successfully via service"
            else
              echo "⚠️ Could not restart nginx automatically - attempting reload..."
              sudo systemctl reload nginx 2>/dev/null || sudo service nginx reload 2>/dev/null || echo "⚠️ Nginx reload also failed - may need manual restart"
            fi
            
            # Verify nginx is running
            sleep 2
            if sudo systemctl is-active --quiet nginx 2>/dev/null || pgrep -x nginx > /dev/null 2>&1; then
              echo "✅ Nginx is running"
            else
              echo "⚠️ Warning: Nginx may not be running - please check manually"
            fi
            
            echo ""
            echo "✅ Deployment completed successfully!"
            echo "📝 Final PM2 Status:"
            pm2 list
            echo ""
            echo "🔗 Your app should be running on port 9000"
            echo "📋 To check logs: pm2 logs my-compasse-app"
            echo "📊 To monitor: pm2 monit"
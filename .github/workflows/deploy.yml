name: Deploy to VPS

on:
  push:
    branches: [ main ]  # Triggers on push to main branch
  workflow_dispatch:    # Allows manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    # Step 1: Get the code
    - name: Checkout code
      uses: actions/checkout@v3 # Used to get the context for the runner, but actual deployment is remote
      
    # Step 2: Set up SSH agent
    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

    # Step 3: Run remote deployment commands
    - name: Deploy on VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          TARGET_DIR="/var/www/react-app"
          APP_NAME="my-compasse-app"
          REPO_URL="git@github.com:segunemma2003/v0-typing-gibberish.git" # IMPORTANT: Replace with your actual SSH repository URL
          
          # Source NVM if present to ensure node/npm/pm2 are in PATH
          if [ -s "$HOME/.nvm/nvm.sh" ]; then
            . "$HOME/.nvm/nvm.sh"
            nvm use default || nvm use stable || nvm use 20 # Or your desired node version
          fi

          echo "Navigating to ${TARGET_DIR}"
          mkdir -p ${TARGET_DIR} # Ensure target directory exists
          cd ${TARGET_DIR}

          # Check if .git directory exists and ensure remote is SSH, then pull
          if [ -d ".git" ]; then
            echo "Git repository found."
            CURRENT_REMOTE_URL=$(git remote get-url origin)
            if [[ "$CURRENT_REMOTE_URL" != *"${REPO_URL}"* ]]; then
              echo "Remote URL is not SSH, updating to SSH..."
              git remote set-url origin ${REPO_URL}
            fi
            echo "Pulling latest changes..."
            git pull --force
          else
            echo "No Git repository found, cloning with SSH... (Using SSH URL)"
            git clone ${REPO_URL} . # Clone into current directory
          fi

          echo "Installing dependencies on server..."
          npm install --legacy-peer-deps # Or yarn install / pnpm install
          
          echo "Building project on server..."
          npm run build # Or your custom build command
          
          echo "Restarting application..."
          # Check if app is running before trying to reload
          pm2 describe ${APP_NAME} > /dev/null
          RUNNING=$?

          if [ "${RUNNING}" -ne 0 ]; then
            echo "PM2 app ${APP_NAME} not found, starting..."
            pm2 start npm --name ${APP_NAME} -- run start -- -p 9000
          else
            echo "PM2 app ${APP_NAME} found, reloading..."
            pm2 reload ${APP_NAME}
          fi
          pm2 save
          
          echo "Reloading Nginx..."
          sudo systemctl reload nginx
          
          echo "✅ Deployment completed successfully!"
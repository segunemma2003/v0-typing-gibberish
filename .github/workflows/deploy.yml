name: Deploy to VPS

on:
  push:
    branches: [ main ]  # Triggers on push to main branch
  workflow_dispatch:    # Allows manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    # Step 1: Get the code
    - name: Checkout code
      uses: actions/checkout@v3 # Used to get the context for the runner, but actual deployment is remote
      
    # Step 2: Set up SSH agent
    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

    # Step 3: Run remote deployment commands
    - name: Deploy on VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          TARGET_DIR="/var/www/react-app"
          APP_NAME="my-compasse-app"
          REPO_URL="https://github.com/segunemma2003/v0-typing-gibberish.git" # IMPORTANT: Replace with your actual repository URL
          
          echo "Navigating to ${TARGET_DIR}"
          mkdir -p ${TARGET_DIR} # Ensure target directory exists
          cd ${TARGET_DIR}

          # Check if .git directory exists to decide between clone and pull
          if [ -d ".git" ]; then
            echo "Git repository found, pulling latest changes..."
            git pull --force
          else
            echo "No Git repository found, attempting to initialize and pull..."
            # This attempts to make the existing directory a Git repo and pull into it.
            # It respects existing non-Git files as much as possible.
            git init
            git remote add origin ${REPO_URL}
            git pull --force origin main # Pull from main branch
          fi

          echo "Installing dependencies on server..."
          npm install --legacy-peer-deps # Or yarn install / pnpm install
          
          echo "Building project on server..."
          npm run build # Or your custom build command
          
          echo "Restarting application..."
          # Check if app is running before trying to reload
          pm2 describe ${APP_NAME} > /dev/null
          RUNNING=$?

          if [ "${RUNNING}" -ne 0 ]; then
            echo "PM2 app ${APP_NAME} not found, starting..."
            # IMPORTANT: Ensure your ecosystem.config.js is configured or provide full path to entry file
            # Example if your entry is /var/www/react-app/server.js and listens on port 9000
            # pm2 start /var/www/react-app/server.js --name ${APP_NAME} -- --port 9000
            # For Next.js, typically:
            pm2 start npm --name ${APP_NAME} -- run start -- -p 9000
          else
            echo "PM2 app ${APP_NAME} found, reloading..."
            pm2 reload ${APP_NAME}
          fi
          pm2 save
          
          echo "Reloading Nginx..."
          sudo systemctl reload nginx
          
          echo "✅ Deployment completed successfully!"